  <path d="M252 388c2 48 8 92 30 122l18 14 18-14c22-30 28-74 30-122Z" fill="#a56c4d"/>
  <path d="M258 390c2 46 10 84 30 110 8-28 11-72 10-110Z" fill="#b77e5a"/>

