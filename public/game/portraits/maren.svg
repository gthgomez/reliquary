  <path d="M378 301c-15-13-48-13-62 2 16 16 48 16 62-2Z" fill="#f4ead9"/>
  <circle cx="260" cy="303" r="10" fill="#a9752f"/>
  <circle cx="340" cy="303" r="10" fill="#a9752f"/>
  <circle cx="261" cy="303" r="4.2" fill="#241b13"/>
  <circle cx="339" cy="303" r="4.2" fill="#241b13"/>
