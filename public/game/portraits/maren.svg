  <path d="M242 190c14-4 29-4 42 0M318 190c13-4 28-4 42 0" fill="none" stroke="#a97150" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
  <path d="M230 350c-2 18 2 34 10 44M370 350c2 18-2 34-10 44" fill="none" stroke="#8b573c" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
  <path d="M232 323c12 7 25 7 36 2M368 323c-12 7-25 7-36 2" fill="none" stroke="#7d4c35" stroke-width="2.6" stroke-linecap="round" opacity="0.45"/>
  <path d="M224 331c8 10 17 16 27 18M376 331c-8 10-17 16-27 18" fill="none" stroke="#9c654a" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M266 416c4-7 10-10 17-9M316 407c7-1 13 2 17 9" fill="none" stroke="#7d4c35" stroke-width="2" stroke-linecap="round" opacity="0.28"/>
  <path d="M238 372c-7 9-9 20-5 30M362 372c7 9 9 20 5 30" fill="none" stroke="#8b573c" stroke-width="2" stroke-linecap="round" opacity="0.22"/>
  <path d="M208 342c-3 14 0 26 6 35M392 342c3 14 0 26-6 35" fill="none" stroke="#8b573c" stroke-width="1.6" stroke-linecap="round" opacity="0.18"/>
  <path d="M252 430c16 8 32 8 48 0 8-4 15-10 21-18-6 18-18 30-36 35-18-5-30-17-36-35 6 8 11 14 3 18Z" fill="#7d4c35" opacity="0.18"/>
  <path d="M262 178c9 6 18 9 28 9M312 187c9 0 18-3 27-9" fill="none" stroke="#b5825f" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>

