  <path d="M42 780c16-126 74-209 196-242l62 34 62-34c122 33 180 116 196 242Z" fill="url(#maren-robe)"/>
  <path d="M118 780c12-104 56-173 132-202 32 34 68 34 100 0 76 29 120 98 132 202Z" fill="url(#maren-shawl)"/>
  <path d="M250 538c26 42 74 42 100 0l-14 96c-20 16-52 16-72 0Z" fill="#223126"/>

