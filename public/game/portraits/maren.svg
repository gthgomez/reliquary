  <path d="M182 244c72-30 164-30 236 0" fill="none" stroke="#e0b489" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M300 218l15 18-15 22-15-22Z" fill="#d9a06c"/>
  <path d="M300 225v27M292 234h16" stroke="#5f3924" stroke-width="2.4" stroke-linecap="round"/>

