<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="title desc">
  <title id="title">Elder Maren of Hollowmere</title>
  <desc id="desc">Painted-style upper-body portrait of an elderly woman with silver braided hair, a moss-green shawl, a copper circlet and a rune pendant.</desc>
  <defs>
    <linearGradient id="maren-robe" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4a6049"/>
      <stop offset="0.52" stop-color="#334635"/>
      <stop offset="1" stop-color="#162018"/>
    </linearGradient>
    <linearGradient id="maren-shawl" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6f8a61"/>
      <stop offset="0.55" stop-color="#4a654c"/>
      <stop offset="1" stop-color="#2a3d2d"/>
    </linearGradient>
    <linearGradient id="maren-skin" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#dbb08a"/>
      <stop offset="0.48" stop-color="#c28e67"/>
      <stop offset="1" stop-color="#936044"/>
    </linearGradient>
    <radialGradient id="maren-cheek" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#e3b995" stop-opacity="0.7"/>
      <stop offset="0.62" stop-color="#c58f68" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8b573c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="maren-hair" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f0ece1"/>
      <stop offset="0.5" stop-color="#c8c2b3"/>
      <stop offset="1" stop-color="#8f8b7f"/>
    </linearGradient>
    <linearGradient id="maren-hair-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7b1a3"/>
      <stop offset="1" stop-color="#6f6c62"/>
    </linearGradient>
    <linearGradient id="maren-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d29a68"/>
      <stop offset="0.55" stop-color="#a36a45"/>
      <stop offset="1" stop-color="#6d422a"/>
    </linearGradient>
    <linearGradient id="maren-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e2" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff6e2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff6e2" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="maren-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- silhouette mass -->
  <path d="M300 92c-108 0-152 84-146 196 5 76 30 137 72 184l-6 58C108 566 48 650 28 780h544c-20-130-80-214-192-250l-6-58c42-47 67-108 72-184C452 176 408 92 300 92Z" fill="#18211a"/>

