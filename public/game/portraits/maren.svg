  <circle cx="424" cy="328" r="6" fill="#a36a45"/>
  <path d="M176 334v16M424 334v16" stroke="#a36a45" stroke-width="2.4"/>

  <!-- pendant -->
  <path d="M238 532c20 34 42 48 62 52 20-4 42-18 62-52" fill="none" stroke="#7b5a35" stroke-width="3"/>
  <circle cx="300" cy="592" r="27" fill="#3a2c1e" stroke="url(#maren-copper)" stroke-width="5"/>
  <path d="M300 574v36M286 586h28M292 604l8-12 8 12" fill="none" stroke="#d7a26d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- shawl folds and clasp -->
  <path d="M118 758c30-72 72-116 132-134M482 758c-30-72-72-116-132-134" fill="none" stroke="#7f9a68" stroke-width="4" opacity="0.35"/>
  <path d="M206 566c-30 30-48 72-57 126M394 566c30 30 48 72 57 126" fill="none" stroke="#1a261c" stroke-width="5" opacity="0.4"/>
  <circle cx="252" cy="556" r="10" fill="url(#maren-copper)"/>
  <circle cx="252" cy="556" r="4" fill="#2a2017"/>

  <!-- rim light -->
