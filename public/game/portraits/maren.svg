  <path d="M300 104c-101 0-156 68-150 164 2 32 10 58 22 78 6-50 23-92 54-121 20 24 44 38 74 43 30-5 54-19 74-43 31 29 48 71 54 121 12-20 20-46 22-78 6-96-49-164-150-164Z" fill="url(#maren-hair)"/>
