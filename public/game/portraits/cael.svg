<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="title desc">
  <title id="title">Warden Cael of Thornkeep</title>
  <desc id="desc">Painted-style upper-body portrait of a stern warden with cropped dark hair, a scar across his brow, steel pauldrons, a high collar and a thorn sigil brooch.</desc>
  <defs>
    <linearGradient id="cael-cloak" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4c2d2b"/>
      <stop offset="0.5" stop-color="#32201f"/>
      <stop offset="1" stop-color="#15100f"/>
    </linearGradient>
    <linearGradient id="cael-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7aeb4"/>
      <stop offset="0.4" stop-color="#6f777d"/>
      <stop offset="0.7" stop-color="#464d53"/>
      <stop offset="1" stop-color="#24292d"/>
    </linearGradient>
    <linearGradient id="cael-steel-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c646b"/>
      <stop offset="1" stop-color="#252a2e"/>
    </linearGradient>
    <linearGradient id="cael-skin" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d3a07a"/>
      <stop offset="0.5" stop-color="#b77f5b"/>
      <stop offset="1" stop-color="#86543a"/>
    </linearGradient>
    <radialGradient id="cael-cheek" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#ddb08c" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#bb835f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7d4c34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cael-hair" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3b3430"/>
      <stop offset="0.55" stop-color="#241f1d"/>
      <stop offset="1" stop-color="#151211"/>
    </linearGradient>
    <linearGradient id="cael-scar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b49a"/>
      <stop offset="0.5" stop-color="#c9856d"/>
      <stop offset="1" stop-color="#a05d4a"/>
    </linearGradient>
    <linearGradient id="cael-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e2" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff6e2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff6e2" stop-opacity="0.52"/>
    </linearGradient>
    <filter id="cael-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

