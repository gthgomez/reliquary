  <path d="M300 108c-88 0-128 62-126 150 1 12 3 23 6 33 8-46 30-78 66-94 18 18 36 26 54 26s36-8 54-26c36 16 58 48 66 94 3-10 5-21 6-33 2-88-38-150-126-150Z" fill="url(#cael-hair)"/>
