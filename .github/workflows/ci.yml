name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reliquary-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Gameplay and core tests
        run: npm test
      - name: Validate game content
        run: npm run validate:content
      - name: Production build
        run: npm run build
      - name: Browser-free deploy build regression
        run: node --test --test-name-pattern="production web artifact|deploy build" scripts/assert-production-web-shell.test.mjs
      - name: Public web build
        run: npm run build:web
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Production runtime gate
        run: npm run verify:web:runtime
      # test:pwa rewrites index.html, so verify the production artifact first.
      - name: PWA verification and tests
        run: npm run verify:pwa && npm run test:pwa
      - name: Browser regressions
        run: npm run test:browser -- --suite=all
