name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reliquary-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      # Script-level gates (assert-production-web-shell.test.mjs) launch a
      # browser, so chromium must exist before test:platform runs.
      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Vite browser-test flag regression
        run: node --test scripts/vite-browser-test-flag.test.mjs
      - name: Lint
        run: npm run lint
      - name: Gameplay, core, and script tests
        run: npm run test:platform
      - name: Validate game content
        run: npm run validate:content
      - name: Production build
        run: npm run build
      - name: Browser-free deploy build regression
        run: node --test --test-name-pattern="production web artifact|deploy build" scripts/assert-production-web-shell.test.mjs
      - name: Public web build
        run: npm run build:web
      - name: Production runtime gate
        run: npm run verify:web:runtime
      # test:pwa rewrites index.html, so verify the production artifact first.
      - name: PWA verification and tests
        run: npm run verify:pwa && npm run test:pwa
      - name: Browser regressions
        run: npm run test:browser -- --suite=all

  journeys:
    name: Deep chapter journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build browser-test web bundle
        run: node scripts/build-web-test.mjs
      - name: Run deep chapter journeys
        run: node scripts/journeys-ci.mjs
        env:
          RELIQUARY_QA_CHANNEL: ${{ matrix.os == 'ubuntu-latest' && 'chrome' || 'msedge' }}
      # Keep the existing cross-platform journey on the normal build. On Ubuntu,
      # rebuild the test shell with the candidate and collect a separate visual
      # matrix even if an earlier journey failed; the artifact upload stays last.
      - name: Build Elderhall candidate browser-test bundle
        id: elderhall_candidate_build
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: node scripts/build-web-test.mjs
        env:
          RELIQUARY_ELDERHALL_CANDIDATE: '1'
          VITE_ELDERHALL_CANDIDATE: '1'
      - name: Capture Elderhall candidate gameplay evidence
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.elderhall_candidate_build.outcome == 'success' }}
        run: node tests/browser/elderhall-candidate.mjs
        env:
          RELIQUARY_QA_CHANNEL: chrome
          RELIQUARY_ELDERHALL_CANDIDATE: '1'
          VITE_ELDERHALL_CANDIDATE: '1'
      - name: Play the candidate starter journey
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.elderhall_candidate_build.outcome == 'success' }}
        run: node tests/browser/elderhall-candidate-journey.mjs
        env:
          RELIQUARY_QA_CHANNEL: chrome
          VITE_ELDERHALL_CANDIDATE: '1'
      - name: Check the candidate offline
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.elderhall_candidate_build.outcome == 'success' }}
        run: node tests/browser/elderhall-candidate-offline.mjs
        env:
          RELIQUARY_QA_CHANNEL: chrome
          VITE_ELDERHALL_CANDIDATE: '1'
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-${{ matrix.os }}
          # Visible path (S05/O1): dot-directories are silently dropped by the
          # uploader, which is how green runs produced zero artifacts.
          path: qa-evidence
          retention-days: 7
          # The journeys always create their evidence directories; an empty
          # upload is an unexpected failure, not something to ignore.
          if-no-files-found: error
